# GPIO Pin Configuration for Raspberry Pi 4B
# All BCM pin numbers
# Hardware is not yet wired - adjust pins as needed

# Motor driver uses 3-pin H-bridge interface (IN1, IN2, ENA)
# Control logic:
#   Forward:  IN1=HIGH, IN2=LOW,  ENA=PWM
#   Reverse:  IN1=LOW,  IN2=HIGH, ENA=PWM
#   Coast:    IN1=HIGH, IN2=HIGH, ENA=0
#   Brake:    IN1=LOW,  IN2=LOW,  ENA=any
motors:
  left:
    in1_pin: 26          # Direction control 1 
    in2_pin: 20          # Direction control 2 
    ena_pin: 12          # PWM speed control
  right:
    in1_pin: 19          # Direction control 1 
    in2_pin: 16          # Direction control 2 
    ena_pin: 13          # PWM speed control

encoders:
  left:
    channel_a: 22        # Encoder A signal (swapped - was on right)
    channel_b: 23        # Encoder B signal
  right:
    channel_a: 27        # Encoder A signal (swapped - was on left)
    channel_b: 17        # Encoder B signal

uwb:
  anchor1:
    uart_port: "/dev/ttyAMA0"   # UART0 on GPIO 14 (TX) / 15 (RX)
    reset_pin: 18               # Connect to module RESET pin (active low)
  anchor2:
    uart_port: "/dev/ttyAMA2"   # UART2 on GPIO 0 (TX) / 1 (RX)
    reset_pin:  7               # Connect to module RESET pin (active low)

# PWM Configuration
pwm:
  frequency: 10000       # 10kHz PWM frequency (max for motor controller)
